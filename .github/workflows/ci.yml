# CI SilverSprint v3 — docs/06 §3.
#
# Deux niveaux de test, tous deux sur les trois OS :
#   1. binaires natifs C++ (emulateur de firmware, plus tard le parseur serie),
#      qui ne lancent pas Godot ;
#   2. suite GUT en headless, qui est le jalon J0.
#
# Le binaire Godot est telecharge et verifie ici plutot que par une action
# tierce : docs/06 §4 exige des dependances epinglees et reconstructibles sans
# surprise, y compris sur un evenement sans reseau fiable.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.5"

jobs:
  lint:
    name: Lint GDScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.*"
      - name: gdlint
        # `tools` compris : les outils de preuve sont du code du projet, et un
        # outil qui ne passe pas le linter est un outil qu'on relira mal.
        #
        # `audio` compris AUSSI. Il manquait à cette liste depuis sa création :
        # le dossier n'a jamais été relu par le linter, et il y dormait une
        # erreur d'ordre de définitions. Un dossier de code du projet absent de
        # cette ligne est un dossier sans garde — seul `addons/`, qui est du
        # code tiers vendorisé, en est légitimement dehors.
        run: gdlint core hardware scenes tests tools audio

  cpp:
    name: Tests C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configurer
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Compiler
        run: cmake --build build --config RelWithDebInfo -j 2
      - name: Tester
        run: ctest --test-dir build --build-config RelWithDebInfo --output-on-failure

      # L'EMULATEUR SE CONSTRUIT AUSSI SEUL, et le README documente cette
      # commande-la. Elle etait cassee : `tools/ss_emu/CMakeLists.txt` n'avait
      # ni `cmake_minimum_required` ni `project()`, si bien que CMake refusait
      # de le configurer comme racine. Un chemin documente que rien ne garde
      # finit toujours par ne plus marcher.
      - name: Emulateur construit seul, comme le dit le README
        run: |
          cmake -S tools/ss_emu -B tools/ss_emu/build
          cmake --build tools/ss_emu/build --config RelWithDebInfo -j 2
          ctest --test-dir tools/ss_emu/build --build-config RelWithDebInfo --output-on-failure

  gdextension:
    name: GDExtension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install scons

      # godot-cpp represente l'essentiel des quinze minutes de compilation.
      # Mettre en cache `bin/` ne servait a rien : la bibliotheque etait
      # restauree mais SCons recompilait tous les objets, qui vivent ailleurs.
      # godot-cpp lit la variable SCONS_CACHE et y branche un CacheDir : c'est
      # ce dossier-la qu'il faut garder.
      - name: Cache SCons
        uses: actions/cache@v4
        with:
          path: .scons-cache
          key: scons-${{ matrix.os }}-debug-${{ hashFiles('.gitmodules') }}-${{ hashFiles('addons/serial_link/src/*') }}
          restore-keys: |
            scons-${{ matrix.os }}-debug-${{ hashFiles('.gitmodules') }}-
            scons-${{ matrix.os }}-debug-

      - name: Compiler le module
        working-directory: addons/serial_link
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: scons target=template_debug -j2

      - name: Verifier qu'une bibliotheque a bien ete produite
        shell: bash
        run: |
          set -euo pipefail
          ls -la addons/serial_link/bin/
          test -n "$(ls -A addons/serial_link/bin/)"

      - uses: actions/upload-artifact@v4
        with:
          name: serial-link-${{ matrix.os }}
          path: addons/serial_link/bin/
          if-no-files-found: error


  godot:
    name: Tests headless Godot (${{ matrix.os }})
    # Depend du module natif : on teste le projet tel qu'il sera livre, pas une
    # variante amputee de son extension.
    needs: gdextension
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: Godot_v4.5-stable_linux.x86_64.zip
            binary: Godot_v4.5-stable_linux.x86_64
          - os: windows-latest
            archive: Godot_v4.5-stable_win64.exe.zip
            binary: Godot_v4.5-stable_win64.exe
          - os: macos-latest
            archive: Godot_v4.5-stable_macos.universal.zip
            binary: Godot.app/Contents/MacOS/Godot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: serial-link-${{ matrix.os }}
          path: addons/serial_link/bin/

      - name: Recuperer Godot ${{ env.GODOT_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${{ matrix.archive }}"
          curl -sSfL -o godot.zip "$url"
          # unzip n'est pas garanti sous Git Bash ; python l'est sur les trois runners.
          python -c "import zipfile; zipfile.ZipFile('godot.zip').extractall('.godot-bin')"
          chmod +x ".godot-bin/${{ matrix.binary }}" || true
          ".godot-bin/${{ matrix.binary }}" --version

      # L'import est obligatoire : sans lui, les scripts ne se resolvent pas et
      # GUT ne trouve aucun test. Il est lance deux fois — le premier passage
      # genere les .uid, le second les prend en compte.
      - name: Importer le projet
        shell: bash
        run: |
          ".godot-bin/${{ matrix.binary }}" --headless --import || true
          ".godot-bin/${{ matrix.binary }}" --headless --import

      - name: Suite headless — jalon J0
        shell: bash
        run: |
          ".godot-bin/${{ matrix.binary }}" --headless --script tests/run.gd

      # Le module natif doit etre CHARGE, pas seulement compile : une
      # bibliotheque presente mais rejetee par Godot passerait inapercue.
      - name: Verifier que le module natif est charge
        shell: bash
        run: |
          ".godot-bin/${{ matrix.binary }}" --headless --script tools/check_extension.gd

      # Le rejeu des traces de reference PAR L'OUTIL, et non par le seul
      # `core/replay.gd` que la suite exerce deja. `DEPANNAGE` promet a
      # l'operateur qu'une course envoyee peut etre rejouee a l'identique :
      # c'est cette ligne de commande qui tient la promesse, et elle doit
      # marcher sur les trois systemes, pas seulement sur la machine du
      # developpeur. Son code de sortie fait foi — 1 des qu'une trace diverge.
      - name: Rejeu des traces de reference
        shell: bash
        run: |
          ".godot-bin/${{ matrix.binary }}" --headless --script tools/ss_replay.gd -- \
            tests/fixtures/course-distance-4-coureurs.json \
            tests/fixtures/course-poursuite-3-eliminations.json

      # Bout en bout : une course complete menee a l'interface operateur, au
      # simulateur. Les tests unitaires verifient les pieces ; celui-ci verifie
      # que l'assemblage produit bien une course et un CSV.
      - name: Course complete a l'interface — jalon J3
        shell: bash
        run: |
          ".godot-bin/${{ matrix.binary }}" --headless --script tools/ss_operator_demo.gd -- --vitesse 12
