# Publication sur tag — lot 6 de docs/05.
#
# Declenchee UNIQUEMENT sur un tag `v*`, jamais sur un push ordinaire : chaque
# execution telecharge 1,3 Go de modeles d'exportation par OS, ce qui n'a aucun
# sens a chaque commit.
#
# Chaque plateforme construit SON module natif puis exporte : un GDExtension
# compile ailleurs ne serait pas chargeable.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.5"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            preset: Linux
            godot_archive: Godot_v4.5-stable_linux.x86_64.zip
            godot_binary: Godot_v4.5-stable_linux.x86_64
            output: dist/SilverSprint-v3.x86_64
          - os: windows-latest
            label: Windows
            preset: Windows
            godot_archive: Godot_v4.5-stable_win64.exe.zip
            godot_binary: Godot_v4.5-stable_win64.exe
            output: dist/SilverSprint-v3.exe
          - os: macos-latest
            label: macOS
            preset: macOS
            godot_archive: Godot_v4.5-stable_macos.universal.zip
            godot_binary: Godot.app/Contents/MacOS/Godot
            output: dist/SilverSprint-v3.zip
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install scons

      - name: Cache SCons
        uses: actions/cache@v4
        with:
          path: .scons-cache
          key: scons-${{ matrix.os }}-release-${{ hashFiles('.gitmodules') }}-${{ hashFiles('addons/serial_link/src/*') }}
          restore-keys: |
            scons-${{ matrix.os }}-release-

      # Le module natif d'abord : sans lui l'export produit un logiciel muet.
      # On construit la variante `template_release`, celle qu'embarque l'export.
      - name: Compiler le module natif
        working-directory: addons/serial_link
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: scons target=template_release -j2

      # Compiler ne suffit pas : un module qui ne se CHARGE pas donne une release
      # ou tout marche sauf le lien serie, et rien ne rougit. Chargement par
      # ctypes et resolution du point d'entree, identiques sur les trois OS.
      - name: Verifier que le module natif se charge
        run: python scripts/check_extension_binary.py --target template_release

      - name: Recuperer Godot ${{ env.GODOT_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${{ matrix.godot_archive }}"
          python -c "import zipfile; zipfile.ZipFile('godot.zip').extractall('.godot-bin')"
          chmod +x ".godot-bin/${{ matrix.godot_binary }}" || true

      - name: Recuperer les modeles d'exportation
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          python scripts/install_export_templates.py templates.tpz "${GODOT_VERSION}.stable"

      # L'IMPORT NE PEUT PAS ETRE LE GARDE-FOU ICI, et deux fois plutot qu'une.
      #
      # Un build de release ne compile que `template_release` ; la variante
      # `template_debug` que declare `serial_link.gdextension` n'existe donc
      # pas, et Godot le signale. Sous macOS il en sort avec un code non nul, ce
      # qui faisait echouer le job sur une absence parfaitement attendue.
      #
      # Le module de release, lui, est deja verifie plus haut par
      # `check_extension_binary.py`, qui le charge et resout son point d'entree.
      # Et l'export ci-dessous refuse de passer si le binaire produit est vide.
      # Le garde-fou existe donc, il est simplement ailleurs.
      - name: Importer le projet
        shell: bash
        run: |
          ".godot-bin/${{ matrix.godot_binary }}" --headless --import || true
          ".godot-bin/${{ matrix.godot_binary }}" --headless --import || true

      - name: Exporter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ".godot-bin/${{ matrix.godot_binary }}" --headless \
            --export-release "${{ matrix.preset }}" "${{ matrix.output }}"
          ls -la dist/
          test -s "${{ matrix.output }}"

      - uses: actions/upload-artifact@v4
        with:
          name: silversprint-${{ matrix.label }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publier la release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Les deux documents que l'operateur ouvrira le soir venu voyagent AVEC
      # les binaires : quelqu'un qui telecharge une archive n'a pas forcement le
      # depot sous la main, et « voir DEPANNAGE.md » ne veut alors rien dire.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      # UNE ARCHIVE PAR PLATEFORME, et le contenu de `dist/` ENTIER dedans.
      #
      # L'export ne produit pas qu'un executable : sous Linux et sous Windows,
      # le module serie est une bibliotheque partagee qui doit se trouver A COTE
      # de lui. Une premiere version deversait tous les fichiers a plat dans la
      # release, ce qui donnait cinq telechargements dont deux que personne ne
      # pouvait deviner necessaires — et un logiciel qui se lance tres bien,
      # sans jamais voir le boitier.
      #
      # Une archive par plateforme est donc la seule forme honnete : on
      # telecharge un fichier, on l'ouvre, tout y est et au bon endroit.
      - name: Empaqueter, une archive par plateforme
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          for dir in artefacts/*/; do
            label="$(basename "$dir")"
            label="${label#silversprint-}"
            case "$label" in
              Linux) name="SilverSprint-v3-${version}-linux-x86_64" ;;
              Windows) name="SilverSprint-v3-${version}-windows-x86_64" ;;
              macOS) name="SilverSprint-v3-${version}-macos-universal" ;;
              *) name="SilverSprint-v3-${version}-${label}" ;;
            esac
            cp docs/MANUEL-OPERATEUR.md docs/DEPANNAGE.md "$dir"
            (cd "$dir" && zip -r -9 "../../release/${name}.zip" .)
          done
          ls -la release/
      # PRE-VERSION SI LE TAG LE DIT. Convention semver : un tag qui porte un
      # tiret — `v0.9.0-beta` — est une pre-version, et GitHub doit l'annoncer
      # comme telle. Le critere de sortie de `docs/05` est J6, un tiers qui
      # installe sur machine vierge ; tant qu'il n'est pas franchi, publier une
      # version « stable » serait une affirmation que rien ne soutient.
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            **Une archive par plateforme**, construite par la CI sur le systeme
            correspondant. Telecharger celle de son systeme, la decompresser,
            tout lancer depuis le dossier obtenu :

            * `…-linux-x86_64.zip` — l'executable et le module serie
            * `…-windows-x86_64.zip` — idem, `.exe` et `.dll`
            * `…-macos-universal.zip` — l'application `.app`

            Sous Linux et Windows, **le module serie doit rester a cote de
            l'executable** : c'est lui qui parle au boitier. Le manuel operateur
            et le guide de depannage sont dans chaque archive.

            ### Ce qui est valide, et ce qui ne l'est pas

            Le logiciel tourne de bout en bout **au simulateur** : trois modes,
            deux fenetres, ecran scinde, son, enregistrement CSV et JSON
            rejouable. La suite de tests couvre le coeur metier, le lien serie
            contre un emulateur de firmware sur vrai pseudo-terminal, et
            l'interface.

            **Deux jalons ne sont pas franchis** et cette version est donc une
            pre-version :

            * **J1** — validation sur l'Arduino reel. Le lien est eprouve contre
              `ss_emu`, jamais contre le boitier. Derouler `docs/RECETTE.md`
              avant toute utilisation en evenement.
            * **J6** — un tiers installe sur machine vierge et fait courir deux
              personnes sans aide. C'est le critere de sortie de `docs/05`.

            Sans boitier, tout se decouvre au simulateur : panneau **Materiel**,
            interrupteur **Simulateur**.

            ### macOS

            L'application n'est ni signee ni notariee. Au premier lancement,
            faire un clic droit puis « Ouvrir », ou lever la mise en
            quarantaine :

                xattr -dr com.apple.quarantine SilverSprint-v3.app
