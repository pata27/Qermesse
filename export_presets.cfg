; Presets d'export — lot 6 de docs/05.
;
; Versionne volontairement : c'est ce fichier qui decrit les artefacts que la CI
; produit sur tag. Il ne contient aucun secret.
;
; Les binaires du module natif serial_link sont inclus par le .gdextension ;
; l'export echouera si addons/serial_link/bin/ est vide, ce qui est le
; comportement voulu — mieux vaut un export refuse qu'un logiciel muet.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="docs/*, tasks/*, tools/*, tests/*, third_party/*, addons/gut/*, *.md"
export_path="dist/SilverSprint-v3.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"

